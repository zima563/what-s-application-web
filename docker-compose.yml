services:
  mysql:
    image: mysql:8.0
    container_name: whatsapp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: whatsapp_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: whatsapp_auth_service
    restart: always
    environment:
      PORT: 5001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: whatsapp_db
      JWT_SECRET: supersecretwhatsappkey123
    ports:
      - "5001:5001"
    depends_on:
      - mysql

  chat-service:
    build:
      context: ./backend/chat-service
      dockerfile: Dockerfile
    container_name: whatsapp_chat_service
    restart: always
    environment:
      PORT: 5002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: whatsapp_db
      JWT_SECRET: supersecretwhatsappkey123
    ports:
      - "5002:5002"
    depends_on:
      - mysql

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: whatsapp_notification_service
    restart: always
    environment:
      PORT: 5003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: whatsapp_db
      JWT_SECRET: supersecretwhatsappkey123
    ports:
      - "5003:5003"
    depends_on:
      - mysql

  api-gateway:
    image: nginx:alpine
    container_name: whatsapp_api_gateway
    restart: always
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - chat-service
      - notification-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
