version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: whatsapp_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: whatsapp_db
      MYSQL_USER: whatsapp_user
      MYSQL_PASSWORD: whatsapp_password
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: whatsapp_auth_prod
    restart: always
    environment:
      PORT: 5001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: whatsapp_user
      DB_PASSWORD: whatsapp_password
      DB_NAME: whatsapp_db
      JWT_SECRET: super_secret_jwt_key_production_2026
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - whatsapp-network

  chat-service:
    build:
      context: ./backend/chat-service
      dockerfile: Dockerfile
    container_name: whatsapp_chat_prod
    restart: always
    environment:
      PORT: 5002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: whatsapp_user
      DB_PASSWORD: whatsapp_password
      DB_NAME: whatsapp_db
      JWT_SECRET: super_secret_jwt_key_production_2026
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - whatsapp-network

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: whatsapp_notif_prod
    restart: always
    environment:
      PORT: 5003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: whatsapp_user
      DB_PASSWORD: whatsapp_password
      DB_NAME: whatsapp_db
      JWT_SECRET: super_secret_jwt_key_production_2026
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - whatsapp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp_frontend_prod
    restart: always
    networks:
      - whatsapp-network

  api-gateway:
    image: nginx:alpine
    container_name: whatsapp_gateway_prod
    restart: always
    volumes:
      - ./gateway/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
    depends_on:
      - auth-service
      - chat-service
      - notification-service
      - frontend
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge

volumes:
  mysql_prod_data:
